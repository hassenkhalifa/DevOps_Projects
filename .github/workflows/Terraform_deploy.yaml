name: Deploy with Terraform
'on':
  push:
    branches:
      - main
  workflow_dispatch: null
jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.get_ip.outputs.INSTANCE_IP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
        working-directory: NodeJs_Service_Deployment/Terraform
      - name: Terraform Apply
        run: >-
          terraform apply -auto-approve -var="ssh_public_key=${{
          secrets.SSH_PUBLIC_KEY }}"
        working-directory: NodeJs_Service_Deployment/Terraform
        env:
          AWS_ACCESS_KEY_ID: '${{ secrets.AWS_ACCESS_KEY_ID }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
          SSH_PUBLIC_KEY: '${{ secrets.SSH_PUBLIC_KEY }}'
      - name: Get public IP
        id: get_ip
        run: |
          IP=$(terraform output -raw instance_public_ip)
          echo "INSTANCE_IP=$IP" >> $GITHUB_OUTPUT
        working-directory: NodeJs_Service_Deployment/Terraform
      - name: Get public IP
        id: change_inventory_ip
        run: sed -i 's/{{el}}/54.12.13.5/g' inventory.ini
        working-directory: NodeJs_Service_Deployment/Ansible

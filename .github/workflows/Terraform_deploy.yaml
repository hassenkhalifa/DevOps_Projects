name: Deploy with Terraform
'on':
  push:
    branches:
      - main
  workflow_dispatch: null
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
        working-directory: NodeJs_Service_Deployment/Terraform
      - name: Terraform Apply
        run: >-
          terraform apply -auto-approve -var="ssh_public_key=${{
          secrets.SSH_PUBLIC_KEY }}"
        working-directory: NodeJs_Service_Deployment/Terraform
        env:
          AWS_ACCESS_KEY_ID: '${{ secrets.AWS_ACCESS_KEY_ID }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
          SSH_PUBLIC_KEY: '${{ secrets.SSH_PUBLIC_KEY }}'
      - name: Get public IP and update inventory
        id: get_ip
        working-directory: NodeJs_Service_Deployment/Ansible
        run: >
          IP=$(terraform output -raw instance_public_ip
          -state=../Terraform/terraform.tfstate)
          
          sed -i "s/{{ EC2IP }}/$IP/g" inventory.ini
      - name: Commit and push inventory update
        working-directory: NodeJs_Service_Deployment/Ansible
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: >
          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add inventory.ini

          git diff --cached --quiet || git commit -m "Update inventory.ini with
          EC2 IP from Terraform"

          git push

name: Deploy with Terraform
'on':
  push:
    branches:
      - main
  workflow_dispatch: null
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
        working-directory: NodeJs_Service_Deployment/Terraform
      - name: Terraform Apply
        run: >-
          terraform apply -auto-approve -var="ssh_public_key=${{
          secrets.SSH_PUBLIC_KEY }}"
        working-directory: NodeJs_Service_Deployment/Terraform
        env:
          AWS_ACCESS_KEY_ID: '${{ secrets.AWS_ACCESS_KEY_ID }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
          SSH_PUBLIC_KEY: '${{ secrets.SSH_PUBLIC_KEY }}'
      - name: Get public IP and update inventory
        run: |
          set -e
          IP=$(terraform output -raw instance_public_ip)
          sed -i "s/{{ EC2IP }}/$IP/g" ../Ansible/inventory.ini
        working-directory: NodeJs_Service_Deployment/Terraform
      - name: Commit and push inventory update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update inventory.ini with EC2 IP from Terraform
          branch: main
          file_pattern: inventory.ini
        working-directory: NodeJs_Service_Deployment/Ansible

- name: Déployer l'application Node.js avec Docker
  hosts: webservers
  become: true
  tasks:
    - name: Construire l'image Docker depuis le Dockerfile
      docker_image:
        build:
          path: ../DockerImages  # chemin relatif depuis le dossier ansible
        name: NodejsApp
        tag: latest

    - name: Lancer le conteneur Docker
      docker_container:
        name: mon_conteneur_node_js
        image: NodejsApp:latest
        state: started
        restart_policy: always
        ports:
          - "3000:3000"
